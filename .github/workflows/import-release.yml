name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import signed source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-import-2.1.3 --repo "$GITHUB_REPOSITORY" --pattern 'dsh-literature-hub-source-2.1.3.tar.gz' --dir /tmp
          gh release download source-import-2.1.3 --repo "$GITHUB_REPOSITORY" --pattern 'dsh-literature-hub-2.1.3.tgz' --dir /tmp
          tar -xzf /tmp/dsh-literature-hub-source-2.1.3.tar.gz -C "$GITHUB_WORKSPACE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: publish literature hub 2.1.3'
          git tag -a v2.1.3 -m '文献库 2.1.3'
          git push origin HEAD:main --tags
          gh release create v2.1.3 /tmp/dsh-literature-hub-2.1.3.tgz --repo "$GITHUB_REPOSITORY" --title '文献库 2.1.3' --notes-file CHANGELOG.md
          gh release delete source-import-2.1.3 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
