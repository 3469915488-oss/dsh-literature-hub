<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>文献库</title><link rel="stylesheet" href="/literature-hub/reader/hub.css"><link rel="stylesheet" href="/literature-hub/reader/editor.css"><link rel="stylesheet" href="/literature-hub/reader/voice.css"></head>
<body>
<div id="app">
  <aside id="library" aria-label="文献目录">
    <header class="library-heading"><span class="brand-icon" data-icon="library" aria-hidden="true"></span><h1>文献库</h1><button id="collapse" class="icon-button" data-icon="panel-left" title="收起目录" aria-label="收起目录"></button></header>
    <div class="directory-heading"><button id="vault-root" class="text-button">知识库</button><span class="spacer"></span><details id="directory-actions"><summary class="icon-button" data-icon="more-horizontal" title="目录操作" aria-label="目录操作"></summary><div class="directory-action-menu glass"><button id="import-open" type="button"><span data-icon="plus"></span>添加资料</button><button id="folder-new" type="button"><span data-icon="folder-plus"></span>新建文件夹</button><button id="folder-actions" type="button"><span data-icon="edit"></span>管理文件夹</button><button id="refresh" type="button"><span data-icon="refresh-cw"></span>刷新目录</button><button id="trash-open" type="button"><span data-icon="trash"></span>回收站</button></div></details></div>
    <nav id="folder-tree" role="tree" aria-label="知识库文件夹"></nav>
    <div class="searchbox"><span data-icon="search" aria-hidden="true"></span><input id="search" type="search" aria-label="搜索当前文件夹" placeholder="搜索当前文件夹" autocomplete="off"></div>
    <div class="filters"><select id="type-filter" aria-label="文件类型"><option value="">所有格式</option><option value="pdf">PDF</option><option value="docx">Word</option><option value="md">Markdown</option><option value="web">网页</option></select><input id="tag-filter" aria-label="按标签筛选" placeholder="标签"></div>
    <div class="list-heading"><span id="list-title">当前文件夹</span><span id="doc-count">0</span></div>
    <div id="documents" role="list" aria-live="polite"></div>
    <footer id="library-footer"><span class="status-dot"></span><span id="connection-status">连接中</span></footer>
  </aside>
  <div id="resize" role="separator" tabindex="0" aria-label="调整目录宽度" aria-orientation="vertical"></div>
  <main id="workspace">
    <header id="document-header"><button id="expand" class="icon-button" data-icon="panel-left" title="展开目录" aria-label="展开目录" hidden></button><div class="doc-heading"><div class="document-title-row"><h2 id="document-title">文献库</h2><button id="rename-open" class="icon-button" data-icon="edit" title="命名" aria-label="命名" hidden></button><button id="delete-open" class="icon-button" data-icon="trash" title="删除文档" aria-label="删除文档" hidden></button></div><div class="document-subtitle"><p id="document-meta"></p><div id="document-tags" aria-label="文献标签"></div></div></div><div class="header-actions"><button id="metadata-edit" class="icon-button" data-icon="tag" title="编辑文献标签" aria-label="编辑文献标签" hidden></button><button id="citation" class="icon-button" data-icon="quote" title="引用" aria-label="引用" hidden></button><button id="reparse" class="icon-button" data-icon="rotate-ccw" title="重新解析" aria-label="重新解析" hidden></button><button id="theme-toggle" class="icon-button" data-icon="moon" title="切换深色主题" aria-label="切换深色主题" aria-pressed="false"></button></div></header>
    <div id="notice" role="alert" hidden><span id="notice-message"></span><div><button id="notice-retry" class="text-button" hidden>重试</button><button id="notice-download" class="text-button" hidden>导出草稿</button><button id="notice-close" class="icon-button" data-icon="x" aria-label="关闭提示"></button></div></div>
    <div id="empty" class="empty"><span class="welcome-symbol" data-icon="library" aria-hidden="true"></span><h2>文献库</h2><div class="welcome-actions"><button id="empty-import" class="primary"><span data-icon="plus"></span>添加资料</button></div></div>
    <div id="opened" hidden>
      <nav class="tabs" aria-label="文献功能"><div class="tab-segment"><button data-tab="read" class="active"><span data-icon="book-open"></span>阅读</button><button data-tab="notes"><span data-icon="sticky-note"></span>笔记 <span id="notes-dot"></span></button><button data-tab="study"><span data-icon="sparkles"></span>学习</button></div><span id="save-status" aria-live="polite"></span></nav>
      <section id="read-tab" class="tab-panel">
        <div id="reader-toolbar"><select id="preview-version" aria-label="预览版本" hidden></select><div class="toolbar-group page-controls"><button id="prev-page" class="icon-button" data-icon="chevron-left" title="上一页" aria-label="上一页"></button><label class="page-field"><input id="page-number" type="number" min="1" value="1" aria-label="页码"><span id="page-count">/ 1</span></label><button id="next-page" class="icon-button" data-icon="chevron-right" title="下一页" aria-label="下一页"></button></div><div class="toolbar-group zoom-controls"><button id="zoom-out" class="icon-button" data-icon="minus" title="缩小" aria-label="缩小"></button><button id="fit-width" class="text-button" title="适合宽度"><span id="zoom-label">100%</span></button><button id="zoom-in" class="icon-button" data-icon="plus" title="放大" aria-label="放大"></button></div><div class="toolbar-group annotation-tools"><button data-tool="select" class="tool active" data-icon="mouse-pointer-2" title="选择" aria-label="选择"></button><button data-tool="highlight" class="tool" data-icon="highlighter" title="高亮" aria-label="高亮"></button><button data-tool="underline" class="tool" data-icon="underline" title="下划线" aria-label="下划线"></button><button data-tool="draw" class="tool" data-icon="pen-line" title="画笔" aria-label="画笔"></button><input id="mark-color" type="color" value="#dca928" aria-label="批注颜色"></div><button id="annotations-toggle" class="icon-button" aria-expanded="false" title="批注" aria-label="批注"><span data-icon="message-circle-more"></span><span id="annotation-count">0</span></button></div>
        <div id="reader-area"><div id="reader-scroll" tabindex="-1"><div id="pdf-pages"></div><article id="text-reader" hidden></article><div id="reader-loading" hidden>正在打开…</div></div><aside id="note-gutter" aria-label="正文批注标记"></aside><aside id="annotations-panel" aria-label="批注" hidden><header><h3>批注</h3><button id="annotations-close" class="icon-button" data-icon="x" aria-label="关闭批注"></button></header><div id="annotations-list"></div></aside></div>
        <div id="reading-footer"><span id="reading-progress"></span><button id="ask-doc" class="text-button"><span data-icon="message-square"></span>讨论</button></div>
      </section>
      <section id="notes-tab" class="tab-panel" hidden>
        <div class="section-heading"><h3>笔记</h3><button id="notes-save" class="subtle" data-icon="check" title="保存笔记" aria-label="保存笔记"></button></div>
        <div id="voice-panel"></div>
        <div id="notes-scroll"><div id="note-editor"></div></div>
        <div class="editor-footer"><span id="note-state"></span><button id="notes-export" class="text-button" title="导出笔记"><span data-icon="download"></span>导出</button></div>
      </section>
      <section id="study-tab" class="tab-panel" hidden><div class="section-heading"><h3>学习</h3><button id="study-start" class="primary"><span data-icon="play"></span>开始</button></div><div class="study-summary"><div class="study-progress-ring"><strong id="study-progress">0%</strong></div><div class="study-summary-copy"><span>学习进度</span><label>掌握度<select id="mastery"><option value="0">未学习</option><option value="1">初次接触</option><option value="2">能够理解</option><option value="3">能够复述</option><option value="4">能够运用</option><option value="5">熟练掌握</option></select></label></div><button id="study-save" class="icon-button" data-icon="check" title="保存学习记录" aria-label="保存学习记录"></button></div><div id="study-current"></div><div id="study-sections"></div><div class="study-actions"><button data-study="task" class="subtle"><span data-icon="list-checks"></span>安排任务</button><button data-study="quiz" class="subtle"><span data-icon="message-square"></span>原文测验</button></div></section>
    </div>
  </main>
</div>
<div id="selection-menu" class="glass" role="toolbar" aria-label="选中文本操作" hidden><button data-selection="ask"><span data-icon="message-square"></span>提问</button><button data-selection="highlight" data-icon="highlighter" title="高亮" aria-label="高亮"></button><button data-selection="underline" data-icon="underline" title="下划线" aria-label="下划线"></button><button data-selection="note"><span data-icon="sticky-note"></span>笔记</button></div>
<dialog id="import-dialog"><form method="dialog" class="dialog-heading"><h2>添加资料</h2><button class="icon-button" data-icon="x" aria-label="关闭"></button></form><label id="drop-zone" for="file-input"><span class="drop-symbol" data-icon="upload"></span><strong>选择文件或拖入</strong><span>PDF · Word · Markdown · TXT · HTML</span><input id="file-input" type="file" accept=".pdf,.doc,.docx,.md,.markdown,.txt,.html,.htm" multiple></label><p id="import-status" role="status"></p></dialog>
<dialog id="folder-dialog"><form id="folder-form"><div class="dialog-heading"><h2 id="folder-dialog-title">新建文件夹</h2><button type="button" id="folder-cancel" class="icon-button" data-icon="x" aria-label="关闭"></button></div><label id="folder-input-label" for="folder-name">名称</label><input id="folder-name" class="wide" required autocomplete="off"><div id="folder-destination" hidden></div><p id="folder-status" role="status"></p><footer class="dialog-actions"><button type="button" id="folder-rename" class="subtle" hidden>改名</button><button type="button" id="folder-move" class="subtle" hidden>移动</button><button id="folder-submit" class="primary">创建</button></footer></form></dialog>
<dialog id="metadata-dialog"><form method="dialog" class="dialog-heading"><h2>文献标签</h2><button class="icon-button" data-icon="x" aria-label="关闭"></button></form><div id="metadata-tag-list" class="editable-tags"></div><div class="tag-entry"><input id="metadata-tags" type="text" maxlength="100" aria-label="添加文献标签" placeholder="输入标签" autocomplete="off"><button id="metadata-tag-add" class="subtle" type="button">添加</button></div><p id="metadata-status" role="status"></p><div class="metadata-actions"><button id="metadata-latest" class="subtle" hidden>读取最新版本</button><button id="metadata-save" class="primary">保存</button></div></dialog>
<dialog id="rename-dialog"><form id="rename-form"><div class="dialog-heading"><h2>重命名文献</h2><button id="rename-close" class="icon-button" type="button" data-icon="x" aria-label="关闭"></button></div><label for="rename-name">文件名</label><div class="rename-field"><input id="rename-name" maxlength="180" required autocomplete="off"><span id="rename-extension"></span></div><p id="rename-status" role="status"></p><div class="dialog-actions"><button id="rename-save" class="primary" type="submit">重命名</button></div></form></dialog>
<dialog id="delete-dialog"><form id="delete-form"><div class="dialog-heading"><h2>删除文档</h2><button type="button" id="delete-close" class="icon-button" data-icon="x" aria-label="关闭"></button></div><p id="delete-document-name"></p><p class="delete-explanation">原件和关联笔记将移到回收站。</p><p id="delete-status" role="status"></p><div class="dialog-actions"><button id="delete-cancel" type="button" class="subtle">取消</button><button id="delete-submit" type="submit" class="danger">移到回收站</button></div></form></dialog>
<dialog id="trash-dialog"><form method="dialog" class="dialog-heading"><h2>回收站</h2><button class="icon-button" data-icon="x" aria-label="关闭"></button></form><p id="trash-status" role="status"></p><ul id="trash-list"></ul></dialog>
<dialog id="annotation-tag-dialog"><form method="dialog" class="dialog-heading"><h2>批注标签</h2><button class="icon-button" data-icon="x" aria-label="关闭"></button></form><div id="annotation-tag-list" class="editable-tags"></div><div class="tag-entry"><input id="annotation-tag-input" maxlength="100" aria-label="添加批注标签" placeholder="输入标签" autocomplete="off"><button id="annotation-tag-add" class="subtle" type="button">添加</button></div><p id="annotation-tag-status" role="status"></p><div class="dialog-actions"><button id="annotation-tag-save" class="primary" type="button">保存</button></div></dialog>
<dialog id="citation-dialog"><form method="dialog" class="dialog-heading"><h2>引用</h2><button class="icon-button" data-icon="x" aria-label="关闭"></button></form><label for="citation-style">格式</label><select id="citation-style"><option value="gbt">GB/T 7714</option><option value="apa">APA</option><option value="bibtex">BibTeX</option></select><pre id="citation-text"></pre><button id="citation-copy" class="primary">复制引用</button></dialog>
<div id="reader-tooltip" role="tooltip" hidden></div>
<script type="module" src="/literature-hub/reader/hub.js"></script>
</body></html>
