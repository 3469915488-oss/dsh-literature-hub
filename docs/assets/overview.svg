<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">文献库界面结构示意</title>
  <desc id="desc">用示例文献展示目录、阅读区、批注、伴读与笔记录音的位置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf5fa"/><stop offset=".5" stop-color="#f7f8fb"/><stop offset="1" stop-color="#e8f0ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".84"/><stop offset="1" stop-color="#eef4ff" stop-opacity=".68"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#395671" flood-opacity=".16"/></filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243248}.muted{fill:#708096}.tiny{font-size:16px}.small{font-size:18px}.body{font-size:21px}.title{font-size:28px;font-weight:700}.h{font-size:23px;font-weight:700}.chip{font-size:15px;font-weight:600}.line{stroke:#d8e1ec;stroke-width:1}.icon{fill:#4f79c8}.note{fill:#2e6cab}.glass{fill:url(#glass);stroke:#ffffff;stroke-opacity:.84}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="38" width="1356" height="824" rx="28" fill="#f9fbfe" stroke="#dbe4ef"/>
    <rect x="42" y="38" width="1356" height="66" rx="28" fill="#eef4fa"/>
    <circle cx="78" cy="71" r="7" fill="#ff726a"/><circle cx="102" cy="71" r="7" fill="#ffc054"/><circle cx="126" cy="71" r="7" fill="#42c773"/>
    <text x="164" y="78" class="ui small">DeepSeek Harness · 文献库</text>
    <rect x="60" y="120" width="242" height="724" rx="20" class="glass"/>
    <text x="86" y="159" class="ui h">我的知识库</text>
    <rect x="78" y="178" width="206" height="39" rx="12" fill="#ffffff" stroke="#dbe4ee"/>
    <text x="96" y="204" class="ui small muted">⌕  检索当前目录</text>
    <text x="86" y="258" class="ui small">⌄  法学</text><text x="110" y="292" class="ui small muted">▸  国际私法</text>
    <rect x="100" y="307" width="174" height="42" rx="11" fill="#dfeaff"/>
    <text x="116" y="334" class="ui small">▾  上诉审研究</text>
    <text x="140" y="369" class="ui small muted">▧  White v. Sample.pdf</text>
    <text x="140" y="401" class="ui small muted">▧  课堂笔记.docx</text>
    <text x="86" y="449" class="ui small">▸  法律史</text><text x="86" y="485" class="ui small">▸  论文项目</text>
    <line x1="78" y1="534" x2="284" y2="534" class="line"/>
    <text x="86" y="572" class="ui chip muted">当前层 · 2 篇资料</text>
    <rect x="78" y="600" width="206" height="48" rx="14" fill="#f0f5ff"/>
    <text x="96" y="631" class="ui small icon">＋ 导入资料</text>
    <text x="86" y="695" class="ui tiny muted">目录对应 Obsidian 真实文件夹</text>
    <text x="86" y="720" class="ui tiny muted">支持任意层级、改名、移动与回收站</text>
    <rect x="320" y="120" width="692" height="724" rx="20" fill="#fff" stroke="#dce5ef"/>
    <text x="354" y="160" class="ui title">White v. Sample</text><text x="354" y="190" class="ui small muted">第 15 页 · PDF · 已保存</text>
    <rect x="354" y="215" width="76" height="34" rx="17" fill="#fff3bc"/><text x="371" y="237" class="ui chip">高亮</text>
    <rect x="440" y="215" width="83" height="34" rx="17" fill="#e5edff"/><text x="457" y="237" class="ui chip">有旁注</text>
    <rect x="533" y="215" width="72" height="34" rx="17" fill="#eaf5ef"/><text x="550" y="237" class="ui chip">救济</text>
    <line x1="354" y1="273" x2="976" y2="273" class="line"/>
    <text x="354" y="321" class="ui h">救济的审查标准</text>
    <text x="354" y="365" class="ui body">上诉审需要先确认原审事实认定与适用规则的范围，</text>
    <rect x="350" y="385" width="562" height="37" rx="5" fill="#fff0a6" opacity=".78"/>
    <text x="354" y="411" class="ui body">再决定是否存在足以影响救济的错误。</text>
    <text x="354" y="457" class="ui body">引文定位、页码与批注会跟随文献版本保存，阅读时</text>
    <text x="354" y="491" class="ui body">可点击右侧便签直接打开对应记录。</text>
    <text x="354" y="555" class="ui h">审查理由</text><text x="354" y="599" class="ui body">文献库将原文、批注、笔记和录音维持在同一资料下。</text>
    <rect x="932" y="378" width="34" height="34" rx="11" fill="#e8f2ff" stroke="#b9d1f6"/><path d="M943 388h12v8h-7l-4 4v-4h-1z" fill="#2e6cab"/>
    <rect x="932" y="480" width="34" height="34" rx="11" fill="#e8f2ff" stroke="#b9d1f6"/><path d="M943 490h12v8h-7l-4 4v-4h-1z" fill="#2e6cab"/>
    <rect x="1030" y="120" width="350" height="352" rx="20" class="glass"/>
    <text x="1056" y="160" class="ui h">批注</text><text x="1325" y="160" class="ui tiny muted">固定标题</text>
    <line x1="1054" y1="180" x2="1356" y2="180" class="line"/>
    <rect x="1056" y="204" width="72" height="30" rx="15" fill="#fff3bc"/><text x="1072" y="225" class="ui chip">高亮</text>
    <rect x="1138" y="204" width="74" height="30" rx="15" fill="#e5edff"/><text x="1153" y="225" class="ui chip">有旁注</text>
    <text x="1056" y="272" class="ui small">“再决定是否存在足以影响救济的错误。”</text>
    <text x="1056" y="306" class="ui small muted">第 15 页 · 点击引文回到原文</text>
    <rect x="1056" y="328" width="300" height="88" rx="12" fill="#fff" stroke="#dbe5ee"/>
    <text x="1072" y="359" class="ui small">需要确认救济与原审错误之间的</text><text x="1072" y="388" class="ui small">因果关系。</text>
    <rect x="1030" y="490" width="350" height="354" rx="20" fill="#fff" stroke="#dce5ef"/>
    <text x="1056" y="530" class="ui h">笔记</text><text x="1302" y="530" class="ui tiny icon">● 录音</text>
    <rect x="1056" y="550" width="300" height="70" rx="12" fill="#f4f8ff" stroke="#d7e5fa"/>
    <text x="1072" y="579" class="ui chip icon">引用 · 第 15 页</text><text x="1072" y="604" class="ui tiny">再决定是否存在足以影响救济的错误</text>
    <text x="1056" y="660" class="ui small">审查框架：</text><text x="1078" y="692" class="ui small muted">1. 确认原审的规则和事实范围</text><text x="1078" y="722" class="ui small muted">2. 记录与救济相关的理由</text>
    <rect x="1056" y="748" width="300" height="58" rx="14" fill="#effbfb" stroke="#cdebed"/>
    <circle cx="1083" cy="777" r="15" fill="#22aeb4"/><path d="M1083 767v20m-7-10h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="1112" y="775" class="ui small">录音：课堂讨论</text><text x="1112" y="796" class="ui tiny muted">12:36 · 查看详情、转写与总结</text>
  </g>
  <text x="58" y="887" class="ui tiny muted">界面结构示意，内容为公开示例，不含任何用户文献、笔记或录音。</text>
</svg>
